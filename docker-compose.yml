
services:
  k6:
    image: grafana/k6:1.4.2
    working_dir: /tests
    volumes:
      - ./scripts:/tests/scripts:ro
      - ./test-data:/tests/test-data:ro
      - ./results:/tests/results
    environment:
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      VUS: ${VUS:-10}
      DURATION: ${DURATION:-30s}
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: "0.0.0.0"
      K6_WEB_DASHBOARD_PORT: "5665"
      K6_WEB_DASHBOARD_EXPORT: "/tests/results/k6-dashboard-report.html"
    ports:
      - "5665:5665"
    command:
      - run
      - /tests/scripts/load-report.js
